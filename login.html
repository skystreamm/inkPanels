<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-08">
    <meta charset="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inkPanels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <div class="form-container">
        <div class="col col-1">
            <div class="image-layer">
                <img src="./assets/login lightning element.png" alt="lightening" class="form-image lightening-1">
                <img src="./assets/login hero element transparent back.png" alt="login hero" class="form-image-main">
                <img src="./assets/login lightning element.png" alt="lightening" class="form-image lightening-2">
            </div>
            <p class="featured-words">You are few minutes away from a world full of </br> the most magnificient stories </br> in human history</p>
        </div>
        <div class="col col-2">
            <div class="btn-box">
                <button class="btn btn-1" id="login">Sign In</button>
                <button class="btn btn-2" id="register">Sign Up</button>
            </div>

            <!-- =========Login Form Container========= -->
            <div class="login-form">
                <div class="form-title">
                    <span>Sign In</span>
                </div>
                <div class="form-contents">
                    <div class="input-box">
                        <input type="text" class="input-field" placeholder="Username" required> 
                    </div>
                    <div class="input-box">
                        <input type="text" class="input-field" placeholder="Password" required>
                    </div>
                    <div class="forgot-pass">
                        <a href="#">Forgot Password?</a>
                    </div>
                    <div class="input-box">
                        <span>Sign In</span>
                        <i class="ri-arrow-right-circle-line"></i>
                    </div>
                </div>
                <div class="social-login">
                    <i class="ri-google-line"></i>
                    <i class="ri-apple-line"></i>
                    <i class="ri-twitter-line"></i>
                    <i class="ri-instagram-line"></i>
                    <i class="ri-threads-line"></i>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
